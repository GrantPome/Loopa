<svg xmlns="http://www.w3.org/2000/svg" width="402" height="131" viewBox="0 0 402 131" fill="none">
  <!--
    Loopa 品牌标识：左侧为标记图形（循环环 + 音符），右侧为字标。
    设计说明：
    - 环形取「Loop（循环）」之意，顺时针 310° 弧线 + 箭头，指向循环播放、反复打磨；
    - 环内一枚八分音符，点明「音乐创作」这件事；
    - 全图只用白色（单色标识），通过 CSS mask 着色，深浅背景都能用。
  -->
  <g transform="translate(6 10) scale(1.11)">
    <!-- 循环环：留出右上角缺口给箭头，起点在右、顺时针绕行 -->
    <path d="M84.867 46.95A35 35 0 1 1 70.075 21.33" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
    <!-- 箭头：接在弧线末端，指向顺时针方向 -->
    <path d="M83.181 30.507 65.773 27.474 74.377 15.186Z" fill="#FFFFFF"/>
    <!-- 环内音符：符头 + 符干 + 符尾 -->
    <ellipse cx="45" cy="60" rx="7.5" ry="6" transform="rotate(-22 45 60)" fill="#FFFFFF"/>
    <path d="M51.5 58V33c6.5 3 10.5 8.5 9.5 16" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- 字标：整体上移，使其与左侧标记图形在视觉上居中对齐 -->
