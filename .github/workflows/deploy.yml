name: Deploy to GitHub Pages

# 推送到 main 分支即自动构建并发布，也可在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署所需的权限：读取代码、写入 Pages、签发 OIDC 令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，新的推送取消进行中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 使用 npm ci 保证依赖与 package-lock.json 完全一致
      - run: npm ci

      # 该命令包含 vue-tsc 类型检查 + vite build
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
